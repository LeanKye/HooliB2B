name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, необходимые для публикации в Pages через OIDC (без токенов и секретов).
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускаем два деплоя одновременно: новый отменяет предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Отдаёт base_path вида "/HooliB2B" — его мы прокидываем в сборку.
      # Внимание: `enablement: true` пытается включить Pages, но дефолтному
      # GITHUB_TOKEN не хватает прав на *создание* Pages-сайта
      # ("Resource not accessible by integration"). В новом репозитории Pages
      # нужно один раз включить вручную: Settings → Pages → Source: GitHub Actions.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
